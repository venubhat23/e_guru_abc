# Configure via .env:
#   DATABASE_URL=postgresql://user:password@host:5432/e_gift_guru_development
# or the individual DB_* variables below. With nothing set, the local Postgres
# socket and your OS user are used.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  connect_timeout: 10
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "e_gift_guru_development") %>
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "e_gift_guru_test") %>
  url: <%= ENV["TEST_DATABASE_URL"] %>

# Production uses ONE database (e.g. Railway Postgres). Solid Queue / Cache / Cable
# tables live in the primary DB (see db/migrate/*_create_solid_tables.rb).
# Connection URL is hardcoded below (Railway private network).
production:
  <<: *default
  url: "postgresql://postgres:jWhWpsAhxrIndGoQuzhxQSFLXrGOWDZM@postgres.railway.internal:5432/railway"
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 %>
